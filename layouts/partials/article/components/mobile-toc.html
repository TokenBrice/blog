{{- if .Scratch.Get "TOCEnabled" -}}
<details class="mobile-toc">
    <summary id="mobile-toc-summary">{{ T "mobileTocContents" }}</summary>
    <nav aria-labelledby="mobile-toc-summary">
        <ul>{{ partial "article/components/mobile-toc-items.html" .Fragments.Headings }}</ul>
    </nav>
</details>
{{- end -}}
