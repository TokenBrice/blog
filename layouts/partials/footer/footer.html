<div class="site-footer">
    <div class="site-footer__brand">
        <img src="{{ "img/main/emblem.svg" | relURL }}" alt="" width="24" height="24" loading="lazy" decoding="async">
        <span>{{ T "chromeFooterTagline" }}</span>
    </div>
    <nav class="site-footer__links" aria-label="{{ T "footerNav" | default "Footer navigation" }}">
        <a href="{{ "/index.xml" | relLangURL }}" data-placement="footer" data-purpose="rss">RSS</a>
        {{ with site.GetPage "page/subscribe" }}<a href="{{ .RelPermalink }}" data-placement="footer" data-purpose="follow">{{ T "menuSubscribe" }}</a>{{ end }}
        <a href="{{ "/guides/" | relLangURL }}" data-placement="footer">{{ T "menuGuides" }}</a>
        <a href="{{ "/glossary/" | relLangURL }}" data-placement="footer">{{ T "menuGlossary" }}</a>
        <a href="{{ "/shows/" | relLangURL }}" data-placement="footer">{{ T "menuShows" }}</a>
        {{ with site.GetPage "page/about" }}<a href="{{ .RelPermalink }}" data-placement="footer">{{ T "menuAbout" }}</a>{{ end }}
        <a href="https://github.com/tokenbrice/blog" rel="external noopener" data-placement="footer">GitHub</a>
    </nav>
    <div class="site-footer__license">
        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license external noopener" data-placement="footer">CC BY-NC-SA 4.0</a>
        <span class="site-footer__hugo">{{ T "chromeFooterCredits" }}</span>
    </div>
</div>
