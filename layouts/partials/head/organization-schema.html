{{- if .IsHome -}}
{{- $siteRoot := strings.TrimSuffix "/" .Site.BaseURL -}}
{{- $organizationId := printf "%s/#organization" $siteRoot -}}
{{- $author := hugo.Data.author -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "{{ $organizationId }}",
  "name": "TokenBrice",
  "alternateName": "TokenBrice - Brutally Honest DeFi",
  "url": "{{ $siteRoot }}",
  "logo": {{ absURL $author.emblem.src | jsonify | safeJS }},
  "description": "Brutally honest analysis and insights into decentralized finance (DeFi), providing educational content about cryptocurrency, lending protocols, DEXs, and DeFi strategies.",
  "foundingDate": "2018",
  "founder": {
    "@id": {{ $author.id | jsonify | safeJS }}
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "general inquiry",
    "availableLanguage": ["English", "French"]
  },
  "audience": {
    "@type": "Audience",
    "audienceType": "DeFi enthusiasts, cryptocurrency investors, blockchain developers"
  }
}
</script>
{{- end -}}
