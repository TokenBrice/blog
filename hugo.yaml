baseurl: https://tokenbrice.xyz
locale: en
theme: [hugo-notice, hugo-theme-stack, matomo]
title: TokenBrice - Brutally Honest DeFi
copyright: TokenBrice

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: en

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: false
enableGitInfo: true

# Keep .Lastmod truthful: front matter only, never the git commit date.
frontmatter:
    lastmod: ["lastmod", "date"]

privacy:
    youtube:
        privacyEnhanced: true

languages:
    en:
        label: English
        title: "TokenBrice"
        weight: 1
        params:
            sidebar:
                subtitle: Brutally Honest DeFi
            dateFormat:
                published: Jan 2, 2006
                lastUpdated: Jan 2, 2006
    fr:
        label: Français
        title: "TokenBrice"
        weight: 2
        params:
            sidebar:
                subtitle: La DeFi, sans détour.
            dateFormat:
                published: 2 Jan 2006
                lastUpdated: 2 Jan 2006

pagination:
    pagerSize: 10
    # First-pager aliases (/page/1/) are pure duplicates of the list root.
    disableAliases: true

services:
    rss:
        limit: 25

# Keep localized sitemaps explicit and avoid mixed-root interpretation across locales.
sitemap:
    filename: sitemap.xml
    changefreq: monthly
    priority: 0.5

outputs:
    home:
        - HTML
        - RSS
    page:
        - HTML
    section:
        - HTML
        - RSS
    taxonomy:
        - HTML
    term:
        - HTML

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    matomo:
        url: "https://ecocrypto.fr/stats/"
        id: 1
    
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    author:
        name: TokenBrice
        email: tokenbrice@proton.me
    favicon: /favicon.ico

    footer:
        since: 2018
        customText:

    dateFormat:
        published: Jan 2, 2006
        lastUpdated: Jan 2, 2006

    sidebar:
        subtitle: Brutally Honest DeFi
        avatar:
            enabled: true
            local: false
            src: /img/main/anthereum-avatar-150.png


    article:
        headingAnchor: false
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: false
    widgets:
        homepage:
            - type: search
            - type: browse
        page:
            - type: toc

    opengraph:
        twitter: 
            # Your Twitter username
            site: TokenBrice

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: true
            local: true
            src: img/main/og-default-1200x630.png

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

### Custom menu
### See https://stack.jimmycai.com/config/menu
menu:
    main: []

    social:
        - identifier: X
          name: X
          url: https://x.com/tokenbrice/
          params:
              icon: brand-x
        - identifier: youtube
          name: YouTube
          url: https://youtube.com/@Token_Brice
          params:
              icon: brand-youtube
        - identifier: telegram
          name: Telegram
          url: https://t.me/tokenbrice_news/
          params:
              icon: brand-telegram
        - identifier: farcaster
          name: Farcaster
          url: https://warpcast.com/tokenbrice
          params:
              icon: brand-farcaster

taxonomies:
    category: categories
    tag: tags
    series: series
    difficulty: difficulty

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: categories
          weight: 10

        - name: series
          weight: 20

        - name: tags
          weight: 1

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        parser:
            # Standalone images render as <figure> via the image render hook; a <p> wrapper would nest it invalidly.
            wrapStandAloneImageWithinParagraph: false
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4

# Expose static images to Hugo Pipes (OG cards, responsive variants) while
# keeping them published as plain static files. Declaring any assets mount
# replaces the default, so the project assets dir is re-declared first.
module:
    mounts:
        - source: assets
          target: assets
        - source: static/img
          target: assets/img

# Responsive picture helpers share these settings and Hugo's processed-image cache.
imaging:
    quality: 80
    resampleFilter: lanczos
