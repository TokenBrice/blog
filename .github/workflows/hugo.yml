name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install image tools and Python validator dependency
        run: |
          sudo apt-get install -y -qq webp libavif-bin imagemagick jq python3-yaml || {
            sudo apt-get update
            sudo apt-get install -y -qq webp libavif-bin imagemagick jq python3-yaml
          }

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ hashFiles('assets/**', 'themes/**', 'hugo.yaml') }}
          restore-keys: hugo-

      - name: Validate source and validator regressions
        run: |
          npm run test:validators
          npm run validate:glossary
          npm run validate:frontmatter
          npm run validate:content

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build modern images and dimensions
        run: bash scripts/build-images.sh

      - name: Build with Hugo
        env:
          HUGO_ENV: production
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --environment production

      - name: Validate generated site output
        run: npm run validate:site

      - name: Prepare pre-deploy IndexNow diff
        id: indexnow
        continue-on-error: true
        run: python3 scripts/indexnow.py prepare --public public --output indexnow-urls.json

      - name: Upload IndexNow diff
        if: steps.indexnow.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.json
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract static site
        run: mkdir -p public && tar -xf pages-artifact/artifact.tar -C public
      - name: Run three mobile Lighthouse samples per page
        run: npx --yes --package=@lhci/cli@0.15.1 lhci autorun --config=.lighthouserc.json
      - name: Retain Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci
            lighthouse-reports
          include-hidden-files: true
          retention-days: 30

  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download pre-deploy URL diff
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: Submit changed canonical URLs after successful deploy
        run: python3 scripts/indexnow.py submit indexnow-urls.json
